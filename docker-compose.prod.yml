# Production stack (two containers). For one public URL on Render/Railway use the root Dockerfile instead.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    environment:
      - AUTO_START=true
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
